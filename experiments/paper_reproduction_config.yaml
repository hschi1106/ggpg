paper_path: paper/Improving_Model_based_GP_for_SR.pdf

function_set:
  - "+"
  - "-"
  - "*"
  - aq

terminal_set:
  include_features: true
  include_erc: true

fitness_function: mse

erc_bounds: "min_x_to_max_x"

train_validation_test_split:
  train: 0.50
  validation: 0.25
  test: 0.25

data_split_seed: 0

repetitions: 5

tree_heights:
  - 3
  - 4
  - 5

max_nodes:
  h3: 15
  h4: 31
  h5: 63

fixed_population_size: 1024

population_sizes:
  - 1024

gpu_batch_sizes:
  - 64
  - 128
  - 256
  - 512
  - 1024

generations: 100

coefficient_mutation_probability: 0.1

ims_g_values:
  - 4
  - 6
  - 8

time_limit_seconds: -1

datasets:
  - Airfoil
  - Boston housing
  - Concrete compressive strength
  - Dow chemical
  - Energy cooling
  - Energy heating
  - Tower
  - Wine red
  - Wine white
  - Yacht hydrodynamics

